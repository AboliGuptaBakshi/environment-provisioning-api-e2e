name: End-to-end tests

on:
  push:
  pull_request:

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run end-to-end suite
        run: python -m unittest discover -s tests -v
